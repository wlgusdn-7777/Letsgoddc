<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">





<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14243e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>단어연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#ffead5;
    --wood-2:#ffdab4;
    --wood-3:#efbf8e;
    --board:#14243e;
    --board-2:#0e1b30;
    --board-edge:#071020;
    --chalk:#f1f5ff;
    --chalk-dim:#bdcbe2;
    --o-color:#8fe0c4;
    --x-color:#f0938a;
    --tape:#e9dfae;
    --gold:#e6cf8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
      linear-gradient(160deg, var(--wood-1), var(--wood-2) 55%, var(--wood-3));
    font-family:'Noto Sans KR', sans-serif;
    color:var(--chalk);
    padding:20px;
    user-select:none;
    -webkit-user-select:none;
  }

  .frame{
    width:min(1100px, 100%);
    background:linear-gradient(180deg, var(--wood-1), var(--wood-2));
    border-radius:22px;
    padding:18px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.06);
    position:relative;
  }
  .frame::before{
    content:"";
    position:absolute; inset:8px;
    border-radius:16px;
    border:2px solid rgba(0,0,0,0.25);
    pointer-events:none;
  }

  header.title{
    color:#182b49;
    text-align:center;
    padding:6px 0 14px;
  }
  header.title h1{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem, 3vw, 2.3rem);
    margin:0;
    color:#652d46;
    letter-spacing:1px;
    text-shadow:none;
  }
  header.title p{
    margin:4px 0 0;
    font-size:0.85rem;
    color:#4f5968;
    font-family:'Gaegu', sans-serif;
  }

  .board{
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(255,255,255,0.03), transparent 50%),
      linear-gradient(160deg, var(--board), var(--board-2));
    border-radius:14px;
    box-shadow: inset 0 0 0 6px var(--board-edge), inset 0 0 40px rgba(0,0,0,0.35);
    padding:18px;
    display:grid;
    grid-template-columns: 230px 1fr;
    gap:18px;
    min-height:560px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:rgba(0,0,0,0.15);
    border-radius:10px;
    padding:14px 12px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .sidebar h2{
    font-family:'Gaegu', sans-serif;
    font-size:1.15rem;
    margin:0 0 4px;
    color:var(--chalk);
    border-bottom:2px dashed rgba(243,239,225,0.25);
    padding-bottom:8px;
  }
  .progress-count{
    font-family:'JetBrains Mono', monospace;
    font-size:0.95rem;
    color:var(--gold);
    margin:8px 0 10px;
    letter-spacing:0.5px;
  }
  .word-list{
    list-style:none;
    margin:0; padding:0;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .word-list li{
    position:relative;
    background:rgba(243,239,225,0.06);
    border-radius:6px;
    padding:8px 10px 8px 30px;
    font-size:0.82rem;
    line-height:1.35;
    animation: dropIn 0.3s ease;
  }
  .word-list li .tape{
    position:absolute; top:-6px; left:14px;
    width:26px; height:12px;
    background:var(--tape);
    opacity:0.55;
    transform:rotate(-4deg);
    border-radius:2px;
  }
  .word-list li .mark{
    position:absolute; left:8px; top:50%;
    transform:translateY(-50%);
    width:16px; height:16px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:0.65rem;
  }
  .word-list li.correct .mark{ color:var(--o-color); border:2px solid var(--o-color); }
  .word-list li.wrong .mark{ color:var(--x-color); border:2px solid var(--x-color); }
  .word-list li .en{ color:var(--chalk); font-weight:700; font-family:'Gaegu', sans-serif; font-size:0.95rem;}
  .word-list li .ko{ color:var(--chalk-dim); display:block; margin-top:1px;}
  @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

  .word-list::-webkit-scrollbar{ width:6px; }
  .word-list::-webkit-scrollbar-thumb{ background:rgba(243,239,225,0.25); border-radius:4px; }

  /* ---------- Main test area ---------- */
  .main-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:10px 8px;
  }

  .word-stage{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    min-height:260px;
  }

  .word-display{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(3rem, 8vw, 5.2rem);
    color:var(--chalk);
    text-align:center;
    letter-spacing:1px;
    text-shadow: 0 0 12px rgba(243,239,225,0.15);
    transition: opacity 0.15s ease;
    padding:0 20px;
    word-break:break-word;
  }
  .word-display.fade{ opacity:0; }

  .stamp-svg{
    opacity:0;
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(340px, 80%);
    height:min(340px, 80%);
    pointer-events:none;
  }
  .stamp-svg path{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .stamp-svg.o path{ stroke:var(--o-color); stroke-width:14; filter:drop-shadow(0 0 6px rgba(143,224,196,0.5)); }
  .stamp-svg.x path{ stroke:var(--x-color); stroke-width:14; filter:drop-shadow(0 0 6px rgba(240,147,138,0.5)); }

  .controls{
    display:flex;
    gap:22px;
    width:100%;
    max-width:520px;
    margin-top:10px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:16px;
    padding:26px 0;
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:2.6rem;
    cursor:pointer;
    touch-action:manipulation;
    transition: transform 0.08s ease, filter 0.15s ease;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn:active{ transform:translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.25); }
  .btn:disabled{ filter:grayscale(0.5) brightness(0.7); cursor:default; }
  .btn-o{ background:linear-gradient(180deg, #a7ecd4, #6fcfae); color:#123626; }
  .btn-x{ background:linear-gradient(180deg, #f6b0a8, #e2776a); color:#4a1712; }

  /* ---------- Result Screen ---------- */
  .result-screen{
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04), transparent 55%),
      linear-gradient(160deg, var(--board), var(--board-2));
    border-radius:14px;
    box-shadow: inset 0 0 0 6px var(--board-edge), inset 0 0 40px rgba(0,0,0,0.35);
    padding:26px 22px;
    min-height:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .hidden{ display:none !important; }

  .result-screen h2{
    font-family:'Gaegu', sans-serif;
    font-size:1.8rem;
    color:var(--gold);
    margin:0 0 4px;
  }
  .score-panel{
    display:flex;
    gap:36px;
    margin:14px 0 22px;
  }
  .score-box{
    text-align:center;
    background:rgba(0,0,0,0.18);
    border-radius:12px;
    padding:14px 26px;
    min-width:120px;
  }
  .score-box .label{
    font-size:0.8rem;
    color:var(--chalk-dim);
    font-family:'Noto Sans KR';
  }
  .score-box .value{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:2rem;
    color:var(--chalk);
    margin-top:4px;
  }
  .score-box.score .value{ color:var(--gold); }

  .result-grid{
    width:100%;
    max-width:720px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
    overflow-y:auto;
    padding-right:4px;
    flex:1;
  }
  .result-card{
    background:rgba(243,239,225,0.07);
    border-radius:10px;
    padding:10px 12px;
    border-left:5px solid transparent;
  }
  .result-card.correct{ border-left-color:var(--o-color); }
  .result-card.wrong{ border-left-color:var(--x-color); }
  .result-card .en{ font-family:'Gaegu', sans-serif; font-size:1.1rem; font-weight:700; color:var(--chalk); }
  .result-card .ko{ font-size:0.75rem; color:var(--chalk-dim); display:block; margin-top:2px; line-height:1.3; }
  .result-card .mark{ float:right; font-family:'JetBrains Mono'; font-weight:700; }
  .result-card.correct .mark{ color:var(--o-color); }
  .result-card.wrong .mark{ color:var(--x-color); }

  .retry-btn{
    margin-top:20px;
    background:linear-gradient(180deg, var(--gold), #c9a94f);
    border:none;
    color:#3a2a08;
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:1.4rem;
    padding:14px 46px;
    border-radius:14px;
    cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    touch-action:manipulation;
  }
  .retry-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.3); }

  @media (max-width:720px){
    .board{ grid-template-columns:1fr; min-height:auto; }
    .sidebar{ order:2; max-height:180px; }
    .main-area{ order:1; }
    .controls{ gap:14px; }
    .btn{ font-size:2rem; padding:20px 0; }
  }

  #meaning{min-height:64px;text-align:center;font-size:clamp(1.1rem,2.2vw,1.7rem);padding:12px;color:#f1f5ff;}
  #feedback{min-height:54px;text-align:center;font-size:2rem;font-weight:900;}
  #revealBtn{display:block;margin:8px auto 18px;padding:12px 30px;font-size:1.1rem;}
  .controls .btn{font-family:'Noto Sans KR',sans-serif;font-size:clamp(1rem,2vw,1.5rem);}
  .retry-btn:disabled{opacity:.45;cursor:default;}
  #reviewNote{color:#bdcbe2;}

  #feedback{min-height:110px;display:flex;align-items:center;justify-content:center;}
  #feedback.strong-feedback{font-size:clamp(2.6rem,7vw,5rem);font-weight:900;color:#ff3978;text-shadow:0 0 14px rgba(255,57,120,.45);line-height:1.2;}
  #pronunciation{text-align:center;color:#c4d5f1;font-size:clamp(1rem,2.4vw,1.4rem);margin:0 0 12px;}

  /* ---------- 추가 / 삭제 ---------- */
  .toolbar{display:flex;gap:12px;justify-content:center;padding:6px 0 14px;}
  .tool-btn{
    border:none;border-radius:12px;padding:10px 34px;
    font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:1.05rem;
    background:linear-gradient(180deg,var(--gold),#c9a94f);color:#3a2a08;
    cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 rgba(0,0,0,0.3);
  }
  .tool-btn.del{background:linear-gradient(180deg,#f6b0a8,#e2776a);color:#4a1712;}
  .tool-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.3);}

  input[type=text]{user-select:text;-webkit-user-select:text;}
  .modal{position:fixed;inset:0;background:rgba(5,10,20,0.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
  .modal-box{
    width:min(480px,100%);max-height:88vh;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(160deg,var(--board),var(--board-2));
    border-radius:14px;padding:18px;box-shadow:inset 0 0 0 4px var(--board-edge),0 20px 50px rgba(0,0,0,0.5);
    color:var(--chalk);
  }
  .modal-box h3{margin:0;font-family:'Gaegu',sans-serif;font-size:1.5rem;color:var(--gold);}
  .modal-box .row{display:flex;gap:8px;}
  .modal-box .row.end{justify-content:flex-end;}
  .modal-box input[type=text]{
    flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:2px solid rgba(243,239,225,0.2);
    background:rgba(0,0,0,0.25);color:var(--chalk);font-size:16px;font-family:'Noto Sans KR',sans-serif;outline:none;
  }
  .modal-box input[type=text]:focus{border-color:var(--gold);}
  .m-btn{
    border:none;border-radius:10px;padding:10px 16px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:0.95rem;
    background:linear-gradient(180deg,var(--gold),#c9a94f);color:#3a2a08;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .m-btn.ghost{background:rgba(243,239,225,0.12);color:var(--chalk);}
  .m-btn.danger{background:linear-gradient(180deg,#f6b0a8,#e2776a);color:#4a1712;}
  .m-btn:disabled{opacity:.4;cursor:default;}
  .m-status{min-height:1.3em;font-size:0.85rem;color:var(--chalk-dim);line-height:1.4;}
  .del-list{overflow-y:auto;flex:1;min-height:200px;max-height:55vh;display:flex;flex-direction:column;gap:6px;padding-right:4px;-webkit-overflow-scrolling:touch;}
  .del-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:rgba(243,239,225,0.06);cursor:pointer;font-size:0.9rem;}
  .del-row.sel{background:rgba(240,147,138,0.22);outline:2px solid var(--x-color);}
  .del-row input{width:18px;height:18px;flex:none;accent-color:#e2776a;}
  .del-row .en{font-family:'Gaegu',sans-serif;font-weight:700;font-size:1.05rem;flex:none;min-width:90px;}
  .del-row .ko{color:var(--chalk-dim);font-size:0.8rem;line-height:1.3;}
  .del-list::-webkit-scrollbar{width:6px;}
  .del-list::-webkit-scrollbar-thumb{background:rgba(243,239,225,0.25);border-radius:4px;}

  /* ---------- 레이아웃 조정 ---------- */
  .sidebar{position:relative;padding:0;display:block;overflow:hidden;}
  .sidebar-inner{position:absolute;inset:0;padding:14px 12px;display:flex;flex-direction:column;min-height:0;}
  .word-list{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .word-stage{padding-bottom:70px;}
  .toolbar{padding:0 0 10px;}
  @media (max-width:720px){ .sidebar{height:180px;} }

  .starmark{color:#ffd500;font-weight:900;text-shadow:0 0 8px rgba(255,213,0,0.55);}
  .modal.sticky{z-index:110;}

  /* ---------- 틀린 단어장 ---------- */
  .main-area{position:relative;}
  .hard-btn{
    position:absolute;top:10px;right:10px;z-index:5;
    border:2px solid rgba(240,147,138,0.7);border-radius:999px;padding:8px 16px;
    background:rgba(240,147,138,0.14);color:#ffd2cc;
    font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;touch-action:manipulation;
  }
  .hard-btn b{display:inline-block;min-width:1.6em;margin-left:4px;padding:1px 6px;border-radius:999px;background:#e2776a;color:#3a0f0a;text-align:center;}
  #hardModal{padding:0;align-items:stretch;justify-content:stretch;z-index:105;}
  #hardModal .modal-box{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;gap:12px;}
  .hard-head{display:flex;align-items:center;gap:14px;flex:none;}
  .hard-head h3{flex:none;}
  .hard-head .m-status{flex:1;min-height:0;}
  .hard-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px;scroll-snap-type:y proximity;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .hard-card{
    flex:none;height:50vh;height:50dvh;scroll-snap-align:start;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px;
    background:rgba(243,239,225,0.07);border-radius:16px;box-shadow:inset 0 0 0 2px rgba(243,239,225,0.12);
  }
  .hard-card .en{font-family:'Gaegu',sans-serif;font-weight:700;font-size:clamp(2.6rem,8vw,5rem);color:var(--gold);line-height:1.1;word-break:break-word;}
  .hard-card .ko{font-size:clamp(1.2rem,3vw,2rem);color:#f1f5ff;line-height:1.5;}
  .hard-empty{margin:auto;text-align:center;color:var(--chalk-dim);line-height:1.7;padding:20px;}
</style>
</head>
<body>

<div class="frame">
  <div class="board" id="testScreen">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <h2>진행 기록</h2>
        <div class="progress-count" id="progressCount">0 / 20</div>
        <ul class="word-list" id="wordList"></ul>
      </div>
    </aside>

    <div class="main-area">
      <button class="hard-btn" id="openHard" type="button">틀린 단어 <b id="hardCount">0</b></button>
      <div class="word-stage">
        <div class="word-display" id="wordDisplay"></div>

      </div>
      
      <div id="meaning" aria-live="polite"></div>
      <div id="feedback" aria-live="polite"></div>
      <div class="toolbar">
        <button class="tool-btn" id="openAdd" type="button">추가</button>
        <button class="tool-btn del" id="openDel" type="button">삭제</button>
      </div>
      <button class="retry-btn" id="revealBtn">뜻 확인</button>
      <div class="controls">
        <button class="btn btn-o" id="btnO">기억나요</button>
        <button class="btn btn-x" id="btnX">다시 외울래요</button>
      </div>
    </div>
  </div>

</div>

<div class="modal hidden" id="addModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3>단어 추가</h3>
    <div class="row">
      <input id="addWord" type="text" placeholder="영어 단어 (예: apple)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="m-btn" id="addSearch" type="button">찾기</button>
    </div>
    <input id="addMeaning" type="text" placeholder="뜻 (찾기 결과가 여기에 들어가요)" autocomplete="off">
    <div class="m-status" id="addStatus"></div>
    <div class="row end">
      <button class="m-btn ghost" type="button" data-close="addModal">닫기</button>
      <button class="m-btn" id="addConfirm" type="button">퀴즈에 추가</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="delModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3>단어 삭제</h3>
    <input id="delFilter" type="text" placeholder="단어 검색" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="m-status" id="delCount">0개 선택</div>
    <div class="del-list" id="delList"></div>
    <div class="row end">
      <button class="m-btn ghost" type="button" data-close="delModal">닫기</button>
      <button class="m-btn danger" id="delConfirm" type="button" disabled>선택한 단어 삭제</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="hardModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="hard-head">
      <h3>틀린 단어장</h3>
      <div class="m-status" id="hardInfo"></div>
      <button class="m-btn ghost" type="button" data-close="hardModal">닫기</button>
    </div>
    <div class="hard-list" id="hardList"></div>
  </div>
</div>

<div class="modal hidden sticky" id="promptModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3>이 단어, 삭제할까요?</h3>
    <div class="m-status" id="pIntro"></div>
    <div class="m-status" id="pCount">0개 선택</div>
    <div class="del-list" id="pList"></div>
    <div class="row end">
      <button class="m-btn ghost" type="button" id="pAll">전체 선택</button>
      <button class="m-btn ghost" type="button" id="pKeep">유지하고 계속</button>
      <button class="m-btn danger" type="button" id="pDelete" disabled>선택한 단어 삭제</button>
    </div>
  </div>
</div>

<script>
const BASE_WORDS = [
  {
    "en": "prepare",

const $ = id => document.getElementById(id);
const shuffle = a => {const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};

/* ===== 사이클 방식 퀴즈 =====
   한 사이클 = 모든 단어를 무작위 순서로 한 번씩. 끝나면 순서를 새로 섞어 다음 사이클.
   진행 상황은 브라우저에 저장돼서 나갔다 들어와도 이어져요. */
const LS_STATE='wm_state_v2';
const OK_MSG=['욜 ㅋㅋ','좀 하누','미친놈'];
const NG_MSG=['븅 ㅋㅋ','깝치지말자','에휴'];
const STREAK_GOAL=4;
let S=null, revealed=false, busy=false, advTimer=null;
const wordByKey=new Map();
function rebuildMap(){wordByKey.clear();for(const w of getPool())wordByKey.set(keyOf(w),w);}
const curWord=()=>wordByKey.get(S.order[S.pos]);
function saveState(){lsSave(LS_STATE,S);}
function loadState(){
  try{const v=JSON.parse(localStorage.getItem(LS_STATE));
    if(v&&Array.isArray(v.order)&&typeof v.pos==='number'&&v.ans&&v.streak)return v;}catch(e){}
  return null;
}
function newOrder(avoidFirst){
  const o=shuffle([...wordByKey.keys()]);
  if(avoidFirst!=null&&o.length>1&&o[0]===avoidFirst){[o[0],o[1]]=[o[1],o[0]];}
  return o;
}
/* 목록에서 단어 빼기 (삭제 / 풀에서 사라진 단어) */
function purge(keys){
  const order=[];let pos=0;
  S.order.forEach((k,i)=>{if(keys.has(k))return;order.push(k);if(i<S.pos)pos++;});
  S.order=order;S.pos=pos;
  for(const k of keys){delete S.ans[k];delete S.streak[k];if(S.wrongStreak)delete S.wrongStreak[k];}
  S.hard=(S.hard||[]).filter(k=>!keys.has(k));
  S.pending=(S.pending||[]).filter(k=>!keys.has(k));
}
function endCycle(){
  const last=S.order[S.order.length-1];
  const cand=S.order.filter(k=>(S.streak[k]||0)>=STREAK_GOAL&&wordByKey.has(k));
  S.cycle++;S.order=newOrder(last);S.pos=0;S.ans={};S.pending=cand;
  saveState();
}
function initQuiz(){
  rebuildMap();
  S=loadState();
  if(!S){S={order:newOrder(),pos:0,cycle:1,ans:{},streak:{},okIdx:0,ngIdx:0,pending:[]};}
  S.pending=S.pending||[];S.okIdx=S.okIdx||0;S.ngIdx=S.ngIdx||0;S.hard=S.hard||[];S.wrongStreak=S.wrongStreak||{};
  // 저장된 상태를 현재 단어 목록과 맞추기
  const gone=new Set(S.order.filter(k=>!wordByKey.has(k)));
  if(gone.size)purge(gone);
  const have=new Set(S.order);
  const missing=[...wordByKey.keys()].filter(k=>!have.has(k));
  for(const k of missing){
    const at=S.pos+Math.floor(Math.random()*(S.order.length-S.pos+1));
    S.order.splice(at,0,k);
  }
  saveState();
  refreshView();
}
function refreshView(){
  clearTimeout(advTimer);busy=false;
  if(S.pos>=S.order.length)endCycle();
  renderHistory();showWord();
  if(S.pending.length)openDelPrompt();
}

/* 뜻 표시: 가장 자주 쓰이는 첫 번째 뜻에 ★ */
function splitMeanings(ko){
  const out=[];let cur='',d=0;
  for(const ch of ko){
    if('([{'.includes(ch))d++;else if(')]}'.includes(ch))d=Math.max(0,d-1);
    if((ch===','||ch===';')&&d===0){if(cur.trim())out.push(cur.trim());cur='';}else cur+=ch;
  }
  if(cur.trim())out.push(cur.trim());
  return out.length?out:[ko];
}
function renderMeaning(ko){fillMeaning($('meaning'),ko);}
function fillMeaning(m,ko){
  const parts=splitMeanings(ko);
  m.replaceChildren();
  const mark=()=>{const x=document.createElement('span');x.className='starmark';x.textContent='★';return x;};
  m.append(mark(),document.createTextNode(' '+parts[0]+' '),mark());
  if(parts.length>1)m.appendChild(document.createTextNode('  '+parts.slice(1).join(', ')));
}

function updateProgress(){$('progressCount').textContent=`${S.pos} / ${S.order.length} · ${S.cycle}사이클`;$('hardCount').textContent=S.hard.length;}
function addHistoryItem(w,known){
  const li=document.createElement('li');li.className=known?'correct':'wrong';
  const en=document.createElement('strong');en.textContent=w.en;
  const ko=document.createElement('div');ko.textContent=w.ko;
  const st=document.createElement('small');st.textContent=known?'기억나요':'복습';
  li.append(en,ko,st);$('wordList').appendChild(li);
}
function renderHistory(){
  const frag=document.createDocumentFragment();
  const tmp=$('wordList');tmp.replaceChildren();
  for(let i=0;i<S.pos;i++){
    const k=S.order[i],w=wordByKey.get(k);
    if(w&&k in S.ans)addHistoryItem(w,S.ans[k]);
  }
  tmp.scrollTop=tmp.scrollHeight;
}
function showWord(){
  const w=curWord();revealed=false;
  $('wordDisplay').textContent=w.en;
  $('meaning').textContent='';$('revealBtn').disabled=false;$('revealBtn').textContent='뜻 확인';
  $('btnO').disabled=true;$('btnX').disabled=true;
  $('feedback').textContent='';$('feedback').classList.remove('strong-feedback');
  updateProgress();
}
function reveal(){
  if(busy)return;revealed=true;renderMeaning(curWord().ko);
  $('revealBtn').disabled=true;$('btnO').disabled=false;$('btnX').disabled=false;
}
function answer(known){
  if(!revealed||busy)return;busy=true;$('btnO').disabled=true;$('btnX').disabled=true;
  const k=S.order[S.pos],w=curWord();
  S.ans[k]=known;
  S.streak[k]=known?(S.streak[k]||0)+1:0;
  S.wrongStreak[k]=known?0:(S.wrongStreak[k]||0)+1;
  if(S.wrongStreak[k]>=2&&!S.hard.includes(k))S.hard.push(k);
  let msg;
  if(known){msg=OK_MSG[S.okIdx%OK_MSG.length];S.okIdx++;}
  else{msg=NG_MSG[S.ngIdx%NG_MSG.length];S.ngIdx++;}
  S.pos++;saveState();
  addHistoryItem(w,known);$('wordList').scrollTop=$('wordList').scrollHeight;
  $('feedback').textContent=msg;
  $('feedback').classList.toggle('strong-feedback',!known);
  $('feedback').style.color=known?'#8fe0c4':'#ff3978';
  updateProgress();
  advTimer=setTimeout(refreshView,900);
}
$('revealBtn').addEventListener('click',reveal);
$('btnO').addEventListener('click',()=>answer(true));
$('btnX').addEventListener('click',()=>answer(false));

function openDelPrompt(){

function finishPrompt(deleteSet){

  for(const k of S.pending){if(!deleteSet.has(k))S.streak[k]=0;}
  S.pending=[];
  if(deleteSet.size)deleteKeys(deleteSet);else saveState();

}

/* --- 네이버 영어사전 조회 --- */
const hasKo=s=>/[가-힣]/.test(s);
const stripTags=s=>String(s).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
const flat=(a,out=[])=>{if(Array.isArray(a))a.forEach(x=>flat(x,out));else if(a!=null)out.push(String(a));return out;};

function parseApi3(json,q){
  const map=json&&json.searchResultMap&&json.searchResultMap.searchResultListMap;
  const items=(map&&map.WORD&&map.WORD.items)||[];
  const it=items.find(i=>stripTags(i.expEntry||'').toLowerCase()===q.toLowerCase());
  if(!it)return null;
  const vals=[];
  for(const c of (it.meansCollector||[])){for(const m of (c.means||[])){const v=stripTags(m.value||'');if(v&&hasKo(v))vals.push(v);}}
  return vals.length?vals.slice(0,4).join(', '):null;
}
function parseAc(data,q){
  const list=(data&&data.items&&data.items[0])||[];
  for(const entry of list){
    const s=flat(entry).map(stripTags).filter(Boolean);
    if(s.length<2)continue;
    if(s[0].toLowerCase()!==q.toLowerCase())continue;
    const m=s.slice(1).find(hasKo);
    if(m)return m;
  }
  return null;
}
function jsonp(url,timeout=6000){
  return new Promise((res,rej)=>{
    const cb='__nv'+Date.now()+Math.floor(Math.random()*1e4);
    const s=document.createElement('script');
    const done=()=>{clearTimeout(t);delete window[cb];s.remove();};
    const t=setTimeout(()=>{done();rej(new Error('timeout'));},timeout);
    window[cb]=d=>{done();res(d);};
    s.onerror=()=>{done();rej(new Error('error'));};
    s.src=url+'&_callback='+cb;
    document.head.appendChild(s);
  });
}
async function fetchJson(url,timeout=6000){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout);
  try{const r=await fetch(url,{signal:ctl.signal});return await r.json();}finally{clearTimeout(t);}
}
async function lookupNaver(q){
  const enc=encodeURIComponent(q);
  try{
    const j=await fetchJson(`https://en.dict.naver.com/api3/enko/search?query=${enc}&m=pc&range=word&lang=ko`);
    const m=parseApi3(j,q);if(m)return m;
  }catch(e){}
  try{
    const d=await jsonp(`https://ac-dict.naver.com/enko/ac?st=11&r_lt=11&q=${enc}&q_enc=utf-8&r_format=json&r_enc=utf-8&r_unicode=0&r_escape=1`);
    const m=parseAc(d,q);if(m)return m;
  }catch(e){}
  return null;
}

/* --- 추가 --- */
$('openAdd').addEventListener('click',()=>{$('addStatus').textContent='';openModal('addModal');setTimeout(()=>$('addWord').focus(),50);});
let searching=false;
async function doSearch(){
  if(searching)return;
  const q=$('addWord').value.trim();
  if(!q){$('addStatus').textContent='영어 단어를 입력해 주세요.';return;}
  if(!/^[A-Za-z][A-Za-z\-' ]*$/.test(q)){$('addStatus').textContent='영어 단어만 입력할 수 있어요.';return;}
  searching=true;$('addSearch').disabled=true;$('addStatus').textContent='네이버 영어사전에서 찾는 중…';
  const m=await lookupNaver(q);
  searching=false;$('addSearch').disabled=false;
  if(m){$('addMeaning').value=m;$('addStatus').textContent='네이버 영어사전 결과예요. 뜻은 고쳐도 돼요.';}
  else{$('addStatus').textContent='뜻을 자동으로 가져오지 못했어요. 아래 칸에 뜻을 직접 적고 추가할 수 있어요.';$('addMeaning').focus();}
}
$('addSearch').addEventListener('click',doSearch);
$('addWord').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});
$('addMeaning').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addConfirm').click();}});
$('addConfirm').addEventListener('click',()=>{
  const en=$('addWord').value.trim(), ko=$('addMeaning').value.trim();
  if(!en||!ko){$('addStatus').textContent='단어와 뜻을 모두 입력해 주세요.';return;}
  if(getPool().some(w=>w.en.toLowerCase()===en.toLowerCase())){$('addStatus').textContent='이미 퀴즈에 있는 단어예요.';return;}
  const w={en,ko};
  addedWords.push(w);
  const ok=lsSave(LS_ADDED,addedWords);
  // 이번 사이클의 바로 다음 순서에 끼워 넣기
  rebuildMap();
  S.order.splice(busy?S.pos:S.pos+1,0,keyOf(w));
  saveState();updateProgress();
  $('addWord').value='';$('addMeaning').value='';
  $('addStatus').textContent=`"${en}" 추가 완료!`+(ok?'':' (저장 공간 문제로 새로고침하면 사라질 수 있어요)');
  $('addWord').focus();
});

/* --- 삭제 --- */
let delSelected=new Set();
function updateDelUI(){
  $('delCount').textContent=`${delSelected.size}개 선택`;
  $('delConfirm').disabled=delSelected.size===0;
}
$('openDel').addEventListener('click',()=>{
  delSelected=new Set();$('delFilter').value='';
  const frag=document.createDocumentFragment();
  for(const w of getPool()){
    const row=document.createElement('label');row.className='del-row';row.dataset.key=keyOf(w);row.dataset.q=(w.en+' '+w.ko).toLowerCase();
    const cb=document.createElement('input');cb.type='checkbox';
    const en=document.createElement('span');en.className='en';en.textContent=w.en;
    const ko=document.createElement('span');ko.className='ko';ko.textContent=w.ko;
    row.append(cb,en,ko);frag.appendChild(row);
  }
  $('delList').replaceChildren(frag);$('delList').scrollTop=0;
  updateDelUI();openModal('delModal');
});
$('delList').addEventListener('change',e=>{
  const row=e.target.closest('.del-row');if(!row)return;
  if(e.target.checked){delSelected.add(row.dataset.key);row.classList.add('sel');}
  else{delSelected.delete(row.dataset.key);row.classList.remove('sel');}
  updateDelUI();
});
$('delFilter').addEventListener('input',()=>{
  const q=$('delFilter').value.trim().toLowerCase();
  for(const row of $('delList').children)row.style.display=(!q||row.dataset.q.includes(q))?'':'none';
});
$('delConfirm').addEventListener('click',()=>{
  const n=delSelected.size;if(!n)return;
  if(getPool().length-n<1){alert('단어를 전부 삭제할 수는 없어요. 최소 1개는 남겨 주세요.');return;}
  if(!confirm(`${n}개 단어를 삭제할까요?\n삭제하면 퀴즈에서 완전히 사라져요.`))return;
  deleteKeys(new Set(delSelected));
  closeModal('delModal');refreshView();
});
function deleteKeys(keys){
  addedWords=addedWords.filter(w=>!keys.has(keyOf(w)));
  for(const w of BASE_WORDS){const k=keyOf(w);if(keys.has(k))deletedKeys.add(k);}
  lsSave(LS_ADDED,addedWords);lsSave(LS_DEL,[...deletedKeys]);
  rebuildMap();purge(keys);saveState();
}

initQuiz();

</script>
